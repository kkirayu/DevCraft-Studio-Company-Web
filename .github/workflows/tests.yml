name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  # Pest: feature + unit tests di SQLite in-memory. Cepat, tidak butuh service.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, bcmath
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      # public/build di-gitignore, sedangkan app.blade.php memakai @vite —
      # tanpa manifest, setiap test yang merender halaman akan gagal.
      - name: Build Assets
        run: npm run build

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: ./vendor/bin/pest

  # Playwright: alur bisnis nyata (visitor + admin) di atas database sekali pakai.
  # Runner dipin ke 24.04 (bukan ubuntu-latest) karena apt di image yang lebih baru
  # membuat `playwright install-deps` gagal — image 24.04 adalah target yang stabil.
  e2e:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, bcmath
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # Aset harus dibangun dulu: webServer Playwright menyajikan halaman lewat @vite.
      - name: Build Assets
        run: npm run build

      # Mirror apt Azure kadang gagal resolve DNS sesaat -> matikan retry bawaan
      # (1x) dan pasang retry+timeout supaya job tidak mati karena infra.
      - name: Make APT resilient
        run: |
          sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "30";
          EOF

      # Dipisah supaya kegagalan apt (deps sistem) tidak menyamar sebagai
      # kegagalan download browser — pesan errornya jadi jelas di log.
      - name: Install Playwright System Dependencies
        run: |
          for i in 1 2 3; do
            npx playwright install-deps chromium && exit 0
            echo "apt attempt $i failed, retry in 15s"
            sleep 15
          done
          exit 1

      - name: Install Playwright Browser
        run: npx playwright install chromium

      # scripts/e2e-server.sh membuat database/e2e.sqlite, migrate:fresh --seed,
      # lalu `php artisan serve` di :8124 — dipakai otomatis oleh webServer Playwright.
      - name: Run E2E Tests
        run: npx playwright test

      - name: Upload Traces and Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
